<meta charset="utf-8">
<script>document.documentElement.classList.add('js');</script>
<script>
/* The motion layer is a class, resolved before the first paint: the device's
   reduced-motion setting is the default, a stored choice wins over it, and either
   way the class can be flipped later without a reload. */
(function () {
  var m = "on";
  try {
    var saved = localStorage.getItem("arsl-motion");
    if (saved === "on" || saved === "off") m = saved;
    else if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) m = "off";
  } catch (e) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) m = "off";
  }
  document.documentElement.classList.add("motion-" + m);
})();
</script>
