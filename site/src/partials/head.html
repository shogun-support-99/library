<script>document.documentElement.classList.add('js');</script>
<script>
/* The motion layer is a class, resolved before the first paint: the device's
   reduced-motion setting is the default, a stored choice wins over it, and either
   way the class can be flipped later without a reload.

   `data-motion-why` records *why* the layer is off, because "off" on its own is
   indistinguishable from broken — a laptop with "reduce motion" switched on in
   its accessibility settings gets a still page, and so does a browser that
   remembers an earlier "turn them off". The page says which one it is.

   ?motion=on / ?motion=off wins over both and is remembered, so there is a way
   back that does not depend on finding a setting in an operating system. */
(function () {
  var r = document.documentElement;
  var m = "on";
  var why = "default";

  var asked = (location.search.match(/[?&]motion=(on|off)/) || [])[1];
  var saved = null;
  try {
    saved = localStorage.getItem("arsl-motion");
  } catch (e) {
    /* private mode: no memory, the device setting decides */
  }

  if (asked) {
    m = asked;
    why = "link";
    try {
      localStorage.setItem("arsl-motion", asked);
    } catch (e) {}
  } else if (saved === "on" || saved === "off") {
    m = saved;
    why = "chosen";
  } else if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    m = "off";
    why = "device";
  }

  r.classList.add("motion-" + m);
  r.setAttribute("data-motion-why", why);
})();
</script>
<script>
/* The scroll-revealed sections are hidden here, before the first paint, rather
   than by app.js a moment later: hiding them late means the page paints them and
   then takes them away. This gate is provisional. app.js claims it with
   `anim-live`; if that never happens, the page is shown instead of left blank. */
(function () {
  var r = document.documentElement;
  r.classList.add("anim");
  window.setTimeout(function () {
    if (!r.classList.contains("anim-live")) r.classList.remove("anim");
  }, 2500);
})();
</script>
